<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen-Based AI Communication Assistant</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#0E1726',
                950: '#070B12',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-[#070B12] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-[#070B12]/80 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
      <!-- Left: Logo & Project Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-teal-400 p-0.5 shadow-md shadow-sky-500/20">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center text-sky-400">
            <i data-lucide="monitor" class="w-5 h-5"></i>
          </div>
        </div>
        <div>
          <h1 class="text-white font-extrabold text-sm sm:text-base tracking-tight leading-tight">
            Screen-Based AI Assistant
          </h1>
          <p class="text-[11px] text-sky-400/90 font-mono tracking-wide">
            Real-Time Visual Translation Platform
          </p>
        </div>
      </div>

      <!-- Center: View Mode Switcher -->
      <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="tab-deck" onclick="app.switchToDeck()" class="px-4 py-1.5 rounded-lg border transition-all flex items-center gap-2">
          <i data-lucide="presentation" class="w-4 h-4"></i>
          <span>Pitch Deck (13 Slides)</span>
        </button>
        <button id="tab-assistant" onclick="app.switchToAssistant()" class="px-4 py-1.5 rounded-lg border transition-all flex items-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4 text-emerald-400"></i>
          <span>⚡ Live Assistant Terminal</span>
        </button>
      </div>

      <!-- Right: Slide Controls -->
      <div class="flex items-center gap-2">
        <button id="prev-slide-btn" onclick="app.prevSlide()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-all" title="Previous Slide (Left Arrow)">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>

        <span id="slide-number-display" class="text-xs font-mono font-bold text-sky-400 px-2.5 py-1 rounded bg-slate-900 border border-slate-800 min-w-[65px] text-center">
          1 / 13
        </span>

        <button id="next-slide-btn" onclick="app.nextSlide()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-all" title="Next Slide (Right Arrow or Space)">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <!-- Slide Drawer Toggle -->
        <button onclick="app.toggleSlideDrawer()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition-all ml-1" title="All Slides Overview">
          <i data-lucide="grid" class="w-4 h-4"></i>
        </button>

        <!-- Fullscreen Toggle -->
        <button onclick="app.toggleFullscreen()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition-all hidden sm:inline-flex" title="Toggle Fullscreen">
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Main Viewport (Renders Slide or Live Simulator) -->
    <main id="main-viewport" class="flex-1 w-full max-w-7xl mx-auto flex flex-col justify-center px-4 sm:px-6 py-4">
      <!-- Populated dynamically by app.js -->
    </main>

    <!-- Slide Thumbnails Drawer (Slide-out menu for quick jump) -->
    <div id="slide-drawer" class="fixed inset-y-0 right-0 z-50 w-80 sm:w-96 bg-[#0B1220]/95 backdrop-blur-xl border-l border-slate-800 shadow-2xl p-6 overflow-y-auto transform translate-x-full transition-transform duration-300 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
          <div class="flex items-center gap-2">
            <i data-lucide="layers" class="w-5 h-5 text-sky-400"></i>
            <h3 class="font-bold text-white text-base">Slide Navigator</h3>
          </div>
          <button onclick="app.toggleSlideDrawer(false)" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div id="slide-thumbnail-list" class="space-y-2">
          <!-- Populated by app.js -->
        </div>
      </div>

      <div class="pt-6 border-t border-slate-800 text-center">
        <button onclick="app.switchToAssistant(); app.toggleSlideDrawer(false);" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-teal-400 text-slate-950 font-bold text-xs uppercase tracking-wider hover:opacity-90 transition-all flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          Launch Live Assistant
        </button>
      </div>
    </div>

    <!-- Bottom Status Bar -->
    <footer class="border-t border-slate-800/80 bg-[#070B12]/80 px-4 sm:px-8 py-2.5 text-xs text-slate-400 flex flex-wrap items-center justify-between gap-3 font-mono">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5 text-sky-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Pure Software Engineering &amp; AI
        </span>
        <span class="hidden md:inline text-slate-600">|</span>
        <span class="hidden md:inline text-slate-400">
          Latency: &lt; 480ms WebSockets
        </span>
      </div>

      <div class="flex items-center gap-4 text-slate-500">
        <span class="hidden sm:inline">Use <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">←</kbd> <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">→</kbd> or <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Space</kbd></span>
        <button onclick="app.goToSlide(11)" class="text-sky-400 hover:text-sky-300 font-semibold underline underline-offset-4">
          Faculty Viva Q&amp;A
        </button>
      </div>
    </footer>

    <!-- App Script -->
    <script src="./src/app.js"></script>
  </body>
</html>
